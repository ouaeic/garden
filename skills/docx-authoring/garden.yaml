id: docx-authoring
version: 2.1.0
catalog_line: 'Create or edit Word documents with real styles, TOC, tables and a rendered proof.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [shell, file_write, file_read, document_read, image_read, publish_artifact, files_list]
  binaries: [/usr/local/lib/garden/python/bin/python3, garden-office-convert, pdftoppm]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  exec:
    [
      /usr/local/lib/garden/python/bin/python3,
      garden-office-convert,
      pdftoppm,
      pdftotext,
      pdffonts,
      pdfinfo,
      fc-list,
      unzip,
      zip
    ]
  connectors: []
  spend: none

verify:
  - run: '/usr/local/lib/garden/python/bin/python3 -c "import docx,sys; d=docx.Document(sys.argv[1]); print(len(d.paragraphs), len(d.tables), [p.style.name for p in d.paragraphs if p.style.name.startswith(''Heading'')])" out.docx'
    assert: 'exits 0, reports a non-zero paragraph count, and lists at least one heading style'
  - run: 'garden-office-convert out.docx proofs/out.pdf'
    assert: 'exits 0'
  - check: 'render-proof passed: page count as expected, fonts embedded, no placeholder tokens, no clipped tables.'
