id: skill-authoring
version: 2.0.0
catalog_line: 'Turn a twice-repeated verified procedure into a reviewed skill, or correct one that misled a run.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [skill, session_search, file_read, file_write]
  binaries: []

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**']
  net.hosts: []
  exec: []
  connectors: []
  spend: none

verify:
  - check: 'At least two distinct verified episodes of the same task shape support the proposal, and the earlier one was found with session_search and named in the reply.'
  - check: 'The body carries all four required headings - When to use, Procedure, Pitfalls, Verification - so the upsert is accepted rather than rejected.'
  - check: 'No absolute path outside the workspace and no credential appears anywhere in the body.'
  - check: 'The owner approved the full rendered body before it was saved.'
