id: media-creation
version: 2.2.0
catalog_line: 'Generate images and speech, edit video and draw diagrams deterministically, then inspect them.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools:
    [
      generate_media,
      image_read,
      audio_read,
      shell,
      file_write,
      publish_artifact,
      file_read,
      files_list
    ]
  binaries: [ffmpeg, ffprobe, magick, dot, pdftoppm]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  # `magick` only: the installer guarantees that one spelling on every supported release, either as
  # ImageMagick 7 or as the compatibility command it installs in front of ImageMagick 6.
  exec: [ffmpeg, ffprobe, magick, dot, pdftoppm]
  connectors: []
  spend: approval

verify:
  - run: 'ffprobe -hide_banner out.mp4'
    assert: 'duration, resolution and stream layout match the brief'
  - check: 'Every generated image was inspected with image_read against the written brief.'
  - check: 'EXIF was stripped from any image leaving the workspace.'
