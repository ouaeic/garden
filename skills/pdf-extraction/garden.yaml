id: pdf-extraction
version: 2.0.0
catalog_line: 'Extract text and tables from PDFs with page provenance, OCR-ing scans first.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [shell, file_read, file_write, document_read, document_search, image_read, files_list]
  binaries:
    [
      pdftotext,
      pdfinfo,
      pdftoppm,
      garden-pdf-tables,
      ocrmypdf,
      tesseract,
      qpdf,
      /usr/local/lib/garden/python/bin/python3
    ]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  exec:
    [
      pdftotext,
      pdfinfo,
      pdftoppm,
      garden-pdf-tables,
      qpdf,
      ocrmypdf,
      /usr/local/lib/garden/python/bin/python3
    ]
  connectors: []
  spend: none

verify:
  - run: 'pdftotext -layout doc.pdf - | wc -c'
    assert: 'at least 200 characters per page for a text PDF'
  - run: 'garden-pdf-tables --path doc.pdf --page 7'
    assert: 'exits 0 and reports ragged false, or the ragged rows were reconciled by hand'
  - check: 'Two rendered pages were compared against their extracted text, and every table reconciles against its total row.'
