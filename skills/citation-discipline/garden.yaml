id: citation-discipline
version: 1.1.0
catalog_line: 'Give every claim a source and a verbatim quote, then re-verify each before delivery.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools:
    [
      browser_snapshot,
      browser_action,
      parallel_web_read,
      document_read,
      document_search,
      file_write,
      web_search
    ]
  binaries: []

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**']
  net.hosts: []
  exec: []
  connectors: []
  spend: none

verify:
  - check: 'Every citation was re-fetched at delivery time and its quoted span located verbatim.'
  - check: 'Each claim is entailed by its quote alone; the rest are labelled reported, inferred or unverified.'
  - check: 'The disconfirming evidence named before searching was looked for, and what turned up is stated.'
