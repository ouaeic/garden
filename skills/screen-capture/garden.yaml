id: screen-capture
version: 1.0.0
catalog_line: 'Save a browser page or the desktop screen as an image file, and check it.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [browser_action, print_pdf, shell, desktop_observe, image_read]
  binaries: [pdftoppm]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/proofs/**', '$WORKSPACE/**']
  net.hosts: []
  exec: [ffmpeg, pdftoppm]
  connectors: []
  spend: none

verify:
  - run: 'pdftoppm -png -r 100 proofs/example.pdf proofs/example'
    assert: 'exit status 0, and proofs/example-1.png exists'
  - check: 'The saved PNG was opened with image_read and shows the page or window that was asked for.'
  - check: 'No shell command named a browser binary, and no path written into a command began with workspace/.'
