id: typst-pdf
version: 2.3.0
catalog_line: 'Typeset precise PDFs — reports, letters, invoices, CVs — from a Typst source.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [shell, file_write, file_read, image_read, publish_artifact, files_list]
  binaries: [typst, pdftoppm, pdffonts, pdfinfo, pdftotext, qpdf]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  exec: [typst, pdftoppm, pdftotext, pdffonts, pdfinfo, qpdf, fc-list]
  connectors: []
  spend: none

verify:
  - run: 'typst compile report.typ report.pdf'
    assert: 'exits 0 with no warnings on stderr'
  - run: 'pdffonts report.pdf'
    assert: 'every font row reports emb=yes'
  - run: 'pdfinfo report.pdf'
    assert: 'the page count is within any stated page limit, one page for a one-page CV'
  - check: 'Every page was inspected; totals recomputed from line items match the printed totals.'
