id: data-analysis
version: 2.5.0
catalog_line: 'Clean and analyse a dataset with a saved re-runnable script and stated assumptions.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools:
    [
      shell,
      file_write,
      file_read,
      files_list,
      image_read,
      set_acceptance,
      publish_artifact,
      document_read
    ]
  binaries: [/usr/local/lib/athanor/python/bin/python3]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  exec: [/usr/local/lib/athanor/python/bin/python3]
  connectors: []
  spend: none

verify:
  - run: '/usr/local/lib/athanor/python/bin/python3 analysis.py'
    assert: 'exits successfully and reproduces expected results in a clean run, with explicit tolerances where needed'
  - check: 'One headline number was reconciled by an independent route, and row counts are printed after every transform.'
