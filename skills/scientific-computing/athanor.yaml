id: scientific-computing
version: 1.6.0
catalog_line: 'Install scientific tools, size large jobs and record reproducible analysis manifests.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [shell, process, file_read, file_write, files_list, set_plan, set_acceptance, notify]
  binaries: [garden-run]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: ['pypi.org', 'files.pythonhosted.org']
  exec: []
  connectors: []
  spend: none

verify:
  - check: 'The selected tools and environment were probed on this machine, and exact dependency locks are saved.'
  - check: 'Raw data identities and sources are recorded, and downloaded content matches available published checksums.'
  - check: 'Thread count and memory use fit the measured workload and concurrently running jobs.'
  - check: 'Declared inputs, source, environment and outputs have a run manifest, with a clean rerun or explicit limits on reproducibility.'
  - check: 'Scientific results were checked independently of the producing implementation.'
