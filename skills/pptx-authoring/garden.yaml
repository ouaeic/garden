id: pptx-authoring
version: 2.2.0
catalog_line: 'Build editable PowerPoint decks from master layouts with native charts and notes.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [shell, file_write, file_read, document_read, image_read, publish_artifact, files_list]
  binaries:
    [/usr/local/lib/garden/python/bin/python3, garden-office-convert, pdftoppm, pdftotext, pdfinfo]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  exec:
    [
      /usr/local/lib/garden/python/bin/python3,
      garden-office-convert,
      pdftoppm,
      pdftotext,
      pdfinfo,
      fc-list
    ]
  connectors: []
  spend: none

verify:
  - run: '/usr/local/lib/garden/python/bin/python3 -c "from pptx import Presentation; import sys; print(len(Presentation(sys.argv[1]).slides._sldIdLst))" deck.pptx'
    assert: 'exits 0 and the slide count matches the plan'
  - run: 'garden-office-convert deck.pptx proofs/deck.pdf'
    assert: 'exits 0 and pdfinfo reports one page per slide'
  - check: 'Round-tripped text word count is within 2 percent of the placed text, so nothing was clipped.'
  # Not "no edge-touching text". The render clause tolerates it on purpose - edgeCrossings defaults
  # its margin to the page edge because "a full-bleed slide with a word deliberately touching the
  # edge is not a defect, and a check that called it one would be refusing correct work"
  # (services/workspace-runner/src/render-proof.ts). This block is emitted into the opened skill
  # verbatim, so while it said otherwise the model was handed the contradiction of SKILL.md
  # Verification 5 inside the same block.
  - check: 'Every slide image was inspected: no overlap, charts labelled, and text at a slide edge is there because that slide is a deliberate full bleed.'
