id: web-form-filling
version: 2.3.0
catalog_line: 'Enumerate, plan, batch-fill and read back any web form or portal; submit within the owner-authorized scope.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [browser_snapshot, read_elements, browser_action, file_read, files_list, image_read]
  binaries: []

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**']
  net.hosts: []
  exec: []
  connectors: []
  spend: none

verify:
  - check: 'Every planned field was read back with read_elements after the batch that set it and holds the intended value with no validation message.'
  - check: 'Uploads and submissions followed the saved security mode without redundant confirmation in Autonomous.'
  - check: 'The completed form was verified against owner-provided facts, and submission was within the requested scope.'
  - check: 'After submission a reference number or re-fetched record confirms it landed.'
  - check: 'Any field populated by the site own autofill was read back and corrected against the owner source data rather than accepted.'
