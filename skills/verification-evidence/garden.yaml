id: verification-evidence
version: 1.4.0
catalog_line: 'Decide what proves a task is done and refuse to finish without that evidence.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools:
    [
      set_acceptance,
      shell,
      file_read,
      document_read,
      image_read,
      audio_read,
      publish_artifact,
      finish,
      files_list
    ]
  binaries: []

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: []
  net.hosts: []
  exec: []
  connectors: []
  spend: none

verify:
  - check: 'Acceptance checks were declared with set_acceptance before the work and all of them pass.'
  - check: 'Every claim in the finish summary cites a tool result, artifact, or rendered image.'
