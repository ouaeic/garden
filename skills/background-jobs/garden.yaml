id: background-jobs
version: 1.5.0
catalog_line: 'Run long or batched work with a manifest, checkpoints and idempotent external writes.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools:
    [
      shell,
      process,
      schedule,
      notify,
      file_read,
      file_write,
      files_list,
      set_plan,
      set_acceptance,
      publish_artifact
    ]
  binaries: [/usr/local/lib/garden/python/bin/python3]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/jobs/**', '$WORKSPACE/**']
  net.hosts: []
  exec: [/usr/local/lib/garden/python/bin/python3]
  connectors: []
  spend: none

verify:
  - run: '/usr/local/lib/garden/python/bin/python3 -c "import json,sys,collections; print(collections.Counter(i[''state''] for i in json.load(open(sys.argv[1]))[''items'']))" jobs/JOB/manifest.json'
    assert: 'no item is still pending or running once the job reports complete, and the done count equals the count reported to the owner'
  - check: 'Three produced artifacts including the first and last were spot-checked, not just the exit code.'
  - check: 'Every external write used an item-derived idempotency key, never a timestamp.'
  - check: 'A scheduled run that found nothing new sent no notice, and a run that found something named the change in the headline.'
