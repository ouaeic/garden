name: Build beta clients

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Build desktop installers without paid signing accounts
        type: boolean
        default: true
      android:
        description: Build signed Android APKs using the persistent repository signing key
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    if: inputs.desktop
    name: ${{ matrix.name }} beta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            targets: ''
            args: '--bundles deb,appimage'
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            targets: ''
            args: '--bundles deb,appimage'
          - name: macos-universal
            runner: macos-15
            targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
            args: '--target universal-apple-darwin --bundles app,dmg'
          - name: windows-x64
            runner: windows-2025
            targets: ''
            args: '--bundles nsis'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:configure
      - run: pnpm --filter @garden/desktop beta:desktop ${{ matrix.args }}
      - name: Retain audited installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garden-beta-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/bundle/**/*.AppImage

  android:
    if: inputs.android
    name: Android beta
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android SDK components
        run: |
          set -eu
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:configure
      - name: Restore the persistent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GARDEN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the persistent Android signing secrets before requesting this build.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/garden-beta.jks"
      - name: Build and audit installable APKs
        env:
          CI: true
          GARDEN_ANDROID_KEYSTORE: ${{ runner.temp }}/garden-beta.jks
          GARDEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GARDEN_ANDROID_KEYSTORE_PASSWORD }}
          GARDEN_ANDROID_KEY_ALIAS: ${{ secrets.GARDEN_ANDROID_KEY_ALIAS }}
          GARDEN_ANDROID_KEY_PASSWORD: ${{ secrets.GARDEN_ANDROID_KEY_PASSWORD }}
        run: pnpm --filter @garden/desktop beta:android --ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garden-beta-android-${{ github.sha }}
          if-no-files-found: error
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
