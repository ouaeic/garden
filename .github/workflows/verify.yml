name: Verify

on:
  pull_request:
  push:
    branches: [main]
  # The measurement rigs are the strongest thing in this repository - a behavioural suite with a
  # committed cost baseline, an injection floor, a context-quality rig and a residency comparison -
  # and they ran in no job at all, while docs/EVALUATION.md said the first of them ran "in CI on
  # its own schedule". None of them is part of `pnpm check`: a suite that blocks every commit is a
  # suite somebody deletes the first week it is wrong about something, and a step count is meant to
  # be argued with. A nightly run is what makes a drift visible within a day instead of whenever
  # somebody next remembers to run it by hand.
  #
  # Their negative controls are the exception and are gated on every change instead, in the
  # `application` job: a rig that has stopped measuring anything is not a drift to argue with.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  # The event is in the group because the nightly run and a push to main share a ref, and without
  # it the schedule would cancel the verification of whatever had just landed.
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    # The nightly trigger exists for the two evaluation jobs at the bottom of this file and for
    # nothing else; every other job here measures a change, and there is no change at 05:17.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # Forty rather than thirty since the document toolchain arrived below: the packages cost a few
    # minutes to fetch, and the proofs they unblock spend a few more actually producing documents.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Evaluation rollback arms read prior versions of the operating contract and editor.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      # Three proofs of the product's headline capability - scripts/test-document.mjs, the render
      # proof and scripts/garden-document-proof - guarded their real work behind existsSync and
      # reported green when the binaries were absent. Nothing was ever installed here, so on this
      # runner the OCR half, the Office half and every rendered-page measurement had never once
      # executed. They fail loudly now instead, which is only worth anything if what they need is
      # actually present.
      #
      # The package names come from the table in scripts/garden-host.sh, the one the installer
      # reads, so a capability that stops being packaged fails this step rather than quietly
      # skipping a proof on a box and here alike. Document and media tools are installed: PostgreSQL,
      # Nginx and the desktop stack belong to an owner's computer, not to a verification runner.
      - name: Install the document and media toolchain the proofs measure
        run: |
          sudo sh -c '
            set -e
            . scripts/garden-host.sh
            garden_detect_host
            packages=""
            for capability in poppler tesseract tesseract-english ffmpeg qpdf img2pdf graphviz ripgrep \
              office-writer office-impress office-calc \
              python python-pip python-docx python-openpyxl python-pillow \
              python-lxml python-xlsxwriter python-pandas python-matplotlib \
              python-scipy python-statsmodels \
              font-carlito font-caladea font-liberation font-dejavu font-noto; do
              name=$(garden_package_for "$capability" "$garden_family")
              [ -n "$name" ] ||
                { echo "no $garden_family package for $capability" >&2; exit 1; }
              packages="$packages $name"
            done
            garden_pm_refresh apt-get
            garden_pm_install apt-get $packages
          '
      # typst is not packaged by any distribution, so the installer pins it by version and by the
      # hash of the exact archive. Both are read back out of scripts/install-native.sh rather than
      # written again here: a second copy of a pin is a pin that drifts, and the three typeset jobs
      # in scripts/garden-document-proof skip themselves without it.
      - name: Install the pinned typesetting engine
        run: |
          set -e
          version=$(sed -n 's/^typst_version="\([^"]*\)"$/\1/p' scripts/install-native.sh)
          expected=$(sed -n 's/^typst_sha256_amd64="\([^"]*\)"$/\1/p' scripts/install-native.sh)
          [ -n "$version" ] && [ -n "$expected" ] ||
            { echo "the typst pin has moved in scripts/install-native.sh" >&2; exit 1; }
          archive=$(mktemp -d)/typst.tar.xz
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" \
            "https://github.com/typst/typst/releases/download/v${version}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$expected  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$(dirname "$archive")"
          sudo install -m 0755 \
            "$(dirname "$archive")/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version
      # The same environment the installer builds, at the same path services/workspace-runner reads
      # from GARDEN_PYTHON, from the repository's own hash-pinned requirements: pypdf is what every
      # measurement of a produced PDF goes through, and python-pptx is no longer packaged by Ubuntu.
      # garden-office-convert goes where scripts/garden-document-proof looks for it, because a
      # LibreOffice that nothing knows how to call converts nothing.
      - name: Prepare the pinned document Python environment
        run: |
          set -e
          sudo install -d -m 0755 /usr/local/lib/garden
          sudo python3 -m venv --system-site-packages /usr/local/lib/garden/python
          sudo /usr/local/lib/garden/python/bin/python3 -m pip install --quiet \
            --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: \
            --requirement infra/native/garden-python-requirements.txt
          sudo chmod -R a+rX /usr/local/lib/garden
          /usr/local/lib/garden/python/bin/python3 -c 'import pypdf, pptx, docx, openpyxl, PIL, pyarrow'
          sudo install -m 0755 scripts/garden-office-convert /usr/local/bin/garden-office-convert
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      # Every shipped script, the skill library and .env.example are checked by
      # scripts/check-repository.mjs, which `pnpm check` runs. The lists used to live here and were
      # missing five programs that ship to an owner's box; discovery replaced them.
      - run: CI=true pnpm check
      # The negative controls for the four measurement rigs, on every change rather than nightly.
      #
      # `evals/` is not a workspace package, so `pnpm -r test` collects nothing in it and these
      # four scripts - which are the only thing that checks the rigs measure what they claim -
      # ran in no job at all. They are what catches a rig that has quietly started measuring
      # nothing: the arms rig locates the contract section it is comparing two arms across, and
      # when the cut it was written to certify landed at 28f3da6 the lookup found the one revision
      # guaranteed not to carry it and threw. Both `pnpm eval:arms` and this selftest exited
      # non-zero on a clean checkout for a whole wave, deterministically, with no key and no
      # network involved, and nothing said so - because nothing ran them.
      #
      # Here rather than in the nightly block below because they cost two seconds together and
      # because the value is naming the commit that broke a rig, not the morning after.
      - name: Prove the measurement rigs still measure something
        run: |
          set -eu
          for rig in context-quality agentdojo arms cards; do
            NODE_OPTIONS=--conditions=development pnpm exec tsx "evals/$rig/selftest.ts"
          done
      # The approval-card rig, run in full here rather than nightly with the other three.
      #
      # It is the only one of the four that measures a security floor rather than a cost, and the
      # only one that is free: no key, no network, no model, five milliseconds of measurement over
      # thirty scenario-mode rows and forty-three guard entries. The other three print a number that is
      # worth arguing with in the morning; this one answers "does a write to `~/.bashrc` still stop
      # for the owner", and a floor that quietly stopped firing is not a drift to argue with.
      #
      # It also fails on more than its baseline. `--ci` adds the baseline comparison, but the guard
      # tables and the provenance rule fail with or without it, because neither is a number anybody
      # should be able to accept: disabling the deferred-execution rule silences fourteen genuine
      # writes while moving the printed total by one card, and switching provenance off moves no
      # printed number at all.
      - name: Check how often this computer stops and asks, against its committed baseline
        run: NODE_OPTIONS=--conditions=development pnpm exec tsx evals/cards/run.ts --ci
      # The same question asked of the test suite itself: can a test pass by iterating nothing?
      #
      # Fifty-one can, twenty-four of them confirmed by mutation - a command-injection guard that
      # passes on an empty table of image types, a regression test for a defect that handed the
      # model unreadable paths, an AGPL compliance claim that cannot fail. The check carries them as
      # a ledger it is meant to empty, and fails on the fifty-second, which is the point: a
      # loop-only assertion is the cheapest way to write a test that can never fail, so this class
      # comes back on every wave unless something is watching for it.
      #
      # Here rather than in `pnpm check` only because `package.json` and `scripts/check-repository.mjs`
      # belong to other lanes this wave; one line in either is the better home and is handed off.
      - name: Prove no test can pass by iterating nothing
        run: node scripts/check-vacuity.mjs
      # eslint.config.js ignores **/*.mjs because the type-aware parser has no project to resolve
      # them against, which left every shipped checker and every release verifier unlinted. They
      # are linted here rather than in `pnpm check` so an owner does not grow a second eslint pass
      # over a couple of dozen files that change a few times a year.
      - name: Lint the scripts eslint.config.js cannot reach
        run: |
          set -eu
          # shellcheck disable=SC2046
          pnpm exec eslint --no-config-lookup --config .github/eslint-scripts.config.mjs \
            $(git ls-files '*.mjs')
      - name: Exercise transactional update and rollback
        run: sh scripts/test-update.sh
      # Beside the update drill rather than with the privileged ones in `native-units`, and the
      # reason is the replay: its last section runs the three SQL statements the check issues
      # against the PGlite in `packages/data/node_modules`, so it needs a completed install. The
      # `native-units` job is checkout and drills alone, with no setup-node, so it would fail on
      # the replay's first line. With PGlite absent this drill fails loudly rather than skipping,
      # which is deliberate: a replay that quietly does not run is the saturated harness it exists
      # to replace.
      - name: Prove doctor still says a model is being withdrawn
        run: sh scripts/test-doctor-retirement.sh
      # The same shape one check along: a health port faked, everything else refused, and the
      # question of whether `doctor` tells a box with no enrolled device apart from one whose
      # devices are all healthy. Needs nothing installed, and sits here because it is a doctor drill.
      - name: Prove doctor says when nothing is enrolled to be notified
        run: sh scripts/test-doctor-notifications.sh

  # The two harnesses that prove the privileged edges of a box still behave, and the drill that
  # measures the one property every confinement directive on the runner unit can silently take
  # away. Five harnesses shipped in scripts/ and nothing ran any of them, so the only automated
  # proof that the agent-account drop works had never once executed - while it is exactly what
  # tightening infra/native/garden-runner.service puts at risk. This job exists so that a
  # directive added to that unit is observed here rather than on somebody's server.
  native-units:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Both replace the tools that need privilege with recorders, so what they assert is the
      # chain the helper builds rather than the host it runs on. Neither needs root, and neither
      # may be run under sudo: sudo resets PATH, which would hand them the real setpriv and unshare
      # and quietly test the host instead of the helper.
      - name: Prove the sandbox still drops an agent command to its own account
        run: sh scripts/test-sandbox.sh
      - name: Prove a failed renewal still records why, and still fails
        run: sh scripts/test-certificate.sh
      # The third of the five shipped harnesses that nothing ran, and the third that needs no host:
      # an advertised endpoint nothing answers on costs every client a failed connection attempt.
      # scripts/release-drill.mjs and scripts/live-drill.mjs are the remaining two and stay manual -
      # one wants a running runner with its shared secret, the other a live model provider.
      - name: Prove the connection manifest still tracks the relay switch
        run: sh scripts/test-relay-endpoint.sh

      # systemd-analyze reads a unit the way the manager will: the accounts, the programs and the
      # environment files have to exist or the load check reports a fault in the host rather than
      # in the file. These are the names scripts/install-native.sh creates.
      - name: Build the accounts and paths the units name
        run: |
          set -eu
          sudo groupadd --force garden-agent
          getent passwd garden >/dev/null ||
            sudo useradd --create-home --home-dir /home/garden --shell /bin/bash garden
          getent passwd garden-agent >/dev/null ||
            sudo useradd --system --no-create-home --home-dir /nonexistent \
              --shell /usr/sbin/nologin --gid garden-agent garden-agent
          getent passwd garden-control >/dev/null ||
            sudo useradd --system --create-home --home-dir /var/lib/garden-control \
              --shell /usr/sbin/nologin garden-control
          sudo install -d -m 0755 /opt/garden /usr/local/lib/garden /etc/garden/tls \
            /etc/garden/relay /var/lib/garden /var/lib/garden-control /etc/nginx/snippets
          sudo install -d -m 2710 -o garden -g garden-agent /home/garden
          programs=$(sed -n 's|^ExecStart=/usr/local/lib/garden/\([a-z][a-z0-9-]*\).*|\1|p' \
            infra/native/*.service | sort -u)
          [ -n "$programs" ] || { echo 'No native unit executables found.' >&2; exit 1; }
          for program in $programs; do
            printf '#!/bin/sh\nexit 0\n' |
              sudo tee "/usr/local/lib/garden/$program" >/dev/null
            sudo chmod 0755 "/usr/local/lib/garden/$program"
          done
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/garden >/dev/null
          sudo chmod 0755 /usr/local/bin/garden
          for environment in runner control; do
            sudo touch "/etc/garden/$environment.env"
            sudo chmod 0600 "/etc/garden/$environment.env"
          done

      # --recursive-errors=no because these units order themselves behind nginx and postgresql,
      # which are not installed here: without it the check reports faults in units this repository
      # does not ship. The template is renamed to an instance so that %i resolves to something.
      - name: Load-check every shipped unit
        run: |
          set -eu
          units=$(mktemp -d)
          cp infra/native/*.service infra/native/*.timer infra/native/*.target "$units/"
          mv "$units/garden@.service" "$units/garden@ci.service"
          for unit in "$units"/*; do
            printf '\n== %s\n' "$(basename "$unit")"
            systemd-analyze verify --recursive-errors=no "$unit"
          done

      # The measurement the hardening is argued against, printed rather than thresholded: the
      # runner unit sits deliberately near the unsafe end - the comment block in the file says why
      # for each omission - and a score committed before the first real run is a score nobody
      # trusts. What gates is the two steps below, which hold the intent rather than the number.
      - name: Measure the confinement of every long-running unit
        run: |
          set -eu
          units=$(mktemp -d)
          cp infra/native/*.service "$units/"
          mv "$units/garden@.service" "$units/garden@ci.service"
          for unit in "$units"/*.service; do
            printf '\n== %s\n' "$(basename "$unit")"
            systemd-analyze security --offline=true --threshold=100 --no-pager "$unit"
          done

      # The runner unit's omissions are a decision, not an oversight, and a decision is worth
      # exactly as much as the thing that notices it being reversed. Each name below is explained
      # in the comment block inside the file; adding one of them turns the agent's hands off, and
      # this is where that is meant to be discovered.
      - name: The runner unit's deliberate omissions are still omissions
        run: |
          set -eu
          unit=infra/native/garden-runner.service
          carries() { grep -Eq "^$1=" "$unit"; }
          for forbidden in NoNewPrivileges RestrictNamespaces ProtectSystem; do
            if carries "$forbidden"; then
              printf '%s sets %s.\n' "$unit" "$forbidden" >&2
              printf 'Read the block beginning "What this unit deliberately does NOT carry" first:\n' >&2
              printf 'that directive stops every agent command on the box.\n' >&2
              exit 1
            fi
          done
          grep -q 'What this unit deliberately does NOT carry' "$unit" ||
            { printf '%s lost the block explaining its omissions\n' "$unit" >&2; exit 1; }
          # The bounding set is inherited across the sudo transition, so a positive list here caps
          # the root-owned helpers at whatever somebody remembered. Only the negative form is safe
          # without a capability audit of apt, unshare and setpriv.
          grep -Eq '^CapabilityBoundingSet=~' "$unit" ||
            { printf '%s must drop capabilities by exclusion, not by list\n' "$unit" >&2; exit 1; }
          for required in SystemCallArchitectures LockPersonality ProtectHostname ProtectClock \
            RestrictRealtime RestrictSUIDSGID ProtectProc ProtectHome; do
            carries "$required" || { printf '%s lost %s\n' "$unit" "$required" >&2; exit 1; }
          done
          # WORKSPACE_ROOT is /home/garden (scripts/install-native.sh), so ProtectHome without
          # an exemption takes every workspace away from the agent.
          #
          # This used to assert `ReadWritePaths=/home/garden` was present, and it was present, and
          # it did not work: `ReadWritePaths=` changes the access mode of a path the namespace can
          # still see, and `ProtectHome=true` mounts over /home so there is nothing left to reopen.
          # The line was there, the comment said what it was for, and on a real box the runner saw
          # `/home` as an empty `d---------` with no `garden` in it and every task failed. A check
          # that reads the text of a mitigation cannot tell a working one from a decorative one, so
          # this one runs it instead - see the namespace drill below, which is the assertion that
          # actually holds this now.
          grep -q '^ProtectHome=tmpfs$' "$unit" ||
            { printf '%s must hide /home with tmpfs, not true\n' "$unit" >&2; exit 1; }
          grep -q '^BindPaths=/home/garden$' "$unit" ||
            { printf '%s hides /home without binding the workspace root back\n' "$unit" >&2; exit 1; }
          if grep -Eq '^ReadWritePaths=/home' "$unit"; then
            printf '%s reopens /home with ReadWritePaths, which cannot reopen a mounted-over path\n' "$unit" >&2
            exit 1
          fi

      # The directives above, RUN rather than read. A unit that carries every hardening line and
      # cannot open its own workspace is the shape this drill exists to catch, and it is the shape
      # that shipped: the text assertion passed on a unit that took the whole product away.
      - name: Prove the home confinement still leaves the workspace root reachable
        run: |
          set -eu
          sudo mkdir -p /home/garden/probe-workspace
          sudo touch /home/garden/probe-workspace/marker
          # What the unit does: the workspace root is there and writable, and no other home is.
          sudo systemd-run --wait --pipe --collect --service-type=oneshot \
            --property=ProtectHome=tmpfs --property=BindPaths=/home/garden \
            /bin/sh -c 'test -f /home/garden/probe-workspace/marker &&
              touch /home/garden/probe-workspace/written &&
              ! ls /home/runner >/dev/null 2>&1'
          sudo test -f /home/garden/probe-workspace/written
          # And the counter-direction, which is the pairing that shipped: it must NOT work, so a
          # future edit back to it fails here rather than on somebody's server.
          if sudo systemd-run --wait --pipe --collect --service-type=oneshot \
            --property=ProtectHome=true --property=ReadWritePaths=/home/garden \
            /bin/sh -c 'test -f /home/garden/probe-workspace/marker'; then
            printf 'ProtectHome=true with ReadWritePaths now reaches the workspace; this drill is stale\n' >&2
            exit 1
          fi
          sudo rm -rf /home/garden/probe-workspace

      # One directive at a time, which is how this unit has to be tightened and now how it is
      # checked. Each confinement directive is put in front of the sudo call on its own, against a
      # control that carries none: a seccomp-based directive applied to a unit with no capability
      # of its own makes systemd set no_new_privs, and no_new_privs makes sudo confer nothing. That
      # is the failure this whole job exists to catch, and it is invisible until a command runs.
      - name: The sudo route survives each confinement directive on its own
        run: |
          set -eu
          printf 'garden ALL=(root) NOPASSWD: /usr/bin/id, /usr/bin/unshare, /usr/bin/apt-get\n' |
            sudo tee /etc/sudoers.d/garden-drill >/dev/null
          sudo chmod 0440 /etc/sudoers.d/garden-drill
          sudo visudo -cf /etc/sudoers.d/garden-drill >/dev/null
          sudo install -d -m 0755 /opt/garden-drill
          # /home is not visible under ProtectHome, so no probe may live in the checkout.
          sudo tee /opt/garden-drill/sudo-probe.sh >/dev/null <<'SUDOPROBE'
          set -eu
          printf 'no_new_privs=%s ' "$(sed -n 's/^NoNewPrivs:[[:space:]]*//p' /proc/self/status)"
          sudo -n /usr/bin/id -u
          SUDOPROBE
          sudo chmod 0755 /opt/garden-drill/sudo-probe.sh
          probe() {
            probe_name=$1
            probe_directive=$2
            set --
            [ -z "$probe_directive" ] || set -- --property="$probe_directive"
            sudo systemd-run --wait --pipe --collect --quiet \
              --unit="garden-drill-$probe_name" --property=RuntimeMaxSec=60 \
              --property=User=garden --property=Group=garden "$@" \
              /bin/sh /opt/garden-drill/sudo-probe.sh
          }
          control=$(probe control '' 2>&1 || true)
          printf '%-46s %s\n' '(no confinement directive)' "$control"
          case "$control" in
          *' 0') ;;
          *)
            printf 'the drill itself cannot reach root; the sudoers fixture is wrong\n' >&2
            exit 1
            ;;
          esac
          index=0
          while IFS= read -r directive; do
            [ -n "$directive" ] || continue
            index=$((index + 1))
            observed=$(probe "d$index" "$directive" 2>&1 || true)
            printf '%-46s %s\n' "$directive" "$observed"
            case "$observed" in
            *' 0') ;;
            *)
              printf '\n%s closes the sudo route the agent sandbox depends on.\n' "$directive" >&2
              printf 'Remove it, or move the drop to the agent account off sudo first.\n' >&2
              exit 1
              ;;
            esac
          done <<'DIRECTIVES'
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          ProtectProc=invisible
          CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_BOOT CAP_SYS_TIME CAP_MAC_ADMIN CAP_MAC_OVERRIDE
          SystemCallArchitectures=native
          LockPersonality=true
          ProtectHostname=true
          ProtectClock=true
          RestrictRealtime=true
          ProtectHome=true
          DIRECTIVES

      # And the whole set together, with the three routes the runner actually needs behind it: the
      # drop to the agent account, the network namespace, and an approved package install writing
      # /usr. Every directive the unit declares for its own processes is handed to a transient unit
      # verbatim, so this measures the file rather than a copy of it. It is also the package
      # install drill a later move to ProtectSystem=strict needs, and the reason that move is not
      # made in the same change as the directives above.
      - name: Drill every privileged route under the runner unit's own directive set
        run: |
          set -eu
          sudo tee /opt/garden-drill/probe.sh >/dev/null <<'PROBE'
          set -eu
          printf 'no_new_privs: %s\n' "$(sed -n 's/^NoNewPrivs:[[:space:]]*//p' /proc/self/status)"
          [ "$(sudo -n /usr/bin/id -u)" = 0 ] ||
            { echo 'the sudo route to the root-owned helpers is closed' >&2; exit 1; }
          [ "$(sudo -n /usr/bin/unshare --net /usr/bin/id -u)" = 0 ] ||
            { echo 'a network namespace can no longer be created' >&2; exit 1; }
          sudo -n /usr/bin/apt-get install -y --no-install-recommends hello >/dev/null ||
            { echo 'an approved package install can no longer write /usr' >&2; exit 1; }
          [ -x /usr/bin/hello ] || { echo 'the package install wrote nothing' >&2; exit 1; }
          [ -d /home/garden ] || { echo 'the workspace root is not reachable' >&2; exit 1; }
          : >/home/garden/.drill
          [ ! -e /home/runner/work ] ||
            { echo 'ProtectHome is not hiding the accounts it should' >&2; exit 1; }
          echo 'ok  sudo, unshare --net, an approved install and the workspace root all still work'
          PROBE
          sudo chmod 0755 /opt/garden-drill/probe.sh
          sudo apt-get update >/dev/null
          # ExecStart is replaced by the probe; Type and the restart policy belong to a service
          # that stays up and would make a one-shot drill either hang or loop. Everything else the
          # unit declares is passed through untouched.
          properties=$(awk '
            /^\[Service\]/ { service = 1; next }
            /^\[/ { service = 0 }
            service && /^[A-Za-z][A-Za-z0-9]*=/ {
              key = substr($0, 1, index($0, "=") - 1)
              if (key == "ExecStart" || key == "Type" || key == "Restart" || key == "RestartSec")
                next
              print
            }' infra/native/garden-runner.service)
          set --
          while IFS= read -r property; do
            [ -n "$property" ] || continue
            set -- "$@" --property="$property"
          done <<PROPERTIES
          $properties
          PROPERTIES
          printf 'handing %s directives from the unit to the drill\n' "$#"
          sudo systemd-run --wait --pipe --collect --quiet --unit=garden-runner-drill \
            --property=RuntimeMaxSec=300 "$@" /bin/sh /opt/garden-drill/probe.sh

      # The renewal unit's confinement is only worth having if the renewal still runs under it. It
      # writes four trees and reloads nginx, and the reload is the part a read-only /run could
      # plausibly take away, so it is drilled rather than reasoned about: a unix socket is not a
      # file write, but that is an argument and this is a measurement.
      - name: Drill the certificate renewal under ProtectSystem=strict
        run: |
          set -eu
          sudo tee /opt/garden-drill/certificate.sh >/dev/null <<'CERTIFICATE'
          set -eu
          for writable in /etc/garden /etc/nginx/snippets /var/lib/garden /usr/local/lib/garden; do
            : >"$writable/.drill" || { echo "$writable is not writable" >&2; exit 1; }
            rm -f "$writable/.drill"
          done
          if ( : >/etc/shadow.drill ) 2>/dev/null; then
            echo 'the rest of /etc is writable; strict is not in force' >&2
            exit 1
          fi
          [ -n "$(systemctl show --property=Version --value)" ] ||
            { echo 'systemctl can no longer reach the manager, so nginx cannot be reloaded' >&2; exit 1; }
          echo 'ok  the four trees are writable, nothing else is, and the reload path is open'
          CERTIFICATE
          sudo chmod 0755 /opt/garden-drill/certificate.sh
          # Read out of the unit rather than written again here: a second copy of a directive set
          # is a directive set that drifts, and this drill is worth having only while it is the
          # same one the timer will use.
          properties=$(awk '
            /^\[Service\]/ { service = 1; next }
            /^\[/ { service = 0 }
            service && /^[A-Za-z][A-Za-z0-9]*=/ {
              key = substr($0, 1, index($0, "=") - 1)
              if (key == "ExecStart" || key == "Type" || key == "Restart" ||
                  key == "RestartSec" || key == "TimeoutStartSec")
                next
              print
            }' infra/native/garden-certificate-renew.service)
          set --
          while IFS= read -r property; do
            [ -n "$property" ] || continue
            set -- "$@" --property="$property"
          done <<PROPERTIES
          $properties
          PROPERTIES
          printf 'handing %s directives from the unit to the drill\n' "$#"
          sudo systemd-run --wait --pipe --collect --quiet --unit=garden-certificate-drill \
            --property=RuntimeMaxSec=60 "$@" /bin/sh /opt/garden-drill/certificate.sh

  # The installer claims four package families and only one of them has ever been executed. This
  # runs the same table, the same detection and the same install dispatch on a dnf host, so a name
  # that stopped existing outside Debian is a red run rather than a report from an owner whose
  # install died halfway. The image is deliberately unpinned: the drift being watched for is the
  # distribution moving underneath the table, and a pinned image cannot see it.
  native-packages:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - name: Give the checkout the tools it needs
        run: dnf install -y --setopt=install_weak_deps=False git-core tar
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Detect the host through the installer's own table
        run: |
          set -eu
          . scripts/garden-host.sh
          garden_detect_host
          printf 'family=%s manager=%s\n' "$garden_family" "$garden_pm"
          [ "$garden_family" = rhel ] ||
            { printf 'a Fedora container was read as %s\n' "$garden_family" >&2; exit 1; }
          case "$garden_pm" in
          dnf | dnf5) ;;
          *)
            printf 'a Fedora container chose %s\n' "$garden_pm" >&2
            exit 1
            ;;
          esac
          printf 'capabilities with no rhel package:\n'
          garden_missing_for_family rhel | sed 's/^/  /'
      # A survey, not a gate. Every name in the rhel column is asked of the real repositories; what
      # it finds is a defect in scripts/garden-host.sh, which this job does not own and cannot fix
      # in the same change. The install below is what gates.
      - name: Survey the whole rhel column against the real repositories
        run: |
          set -eu
          . scripts/garden-host.sh
          garden_detect_host
          garden_pm_refresh "$garden_pm"
          missing=""
          for name in $(garden_packages_for_family rhel | sort -u); do
            if [ -n "$(dnf --quiet repoquery "$name" 2>/dev/null)" ]; then
              printf '  ok      %s\n' "$name"
            else
              printf '  MISSING %s\n' "$name"
              missing="$missing $name"
            fi
          done
          [ -z "$missing" ] || printf '\nnot packaged on this host:%s\n' "$missing"
      # The dispatch itself against a real dnf. The manager strings in garden_pm_install are the
      # part an apt-only run cannot reach, and a wrong flag there fails an owner's install at the
      # first package rather than at the check.
      - name: Install a spanning subset through the installer's own dispatch
        run: |
          set -eu
          . scripts/garden-host.sh
          garden_detect_host
          packages=""
          for capability in curl file jq poppler qpdf ripgrep tar unzip zip \
            tesseract tesseract-english python python-pillow; do
            name=$(garden_package_for "$capability" "$garden_family")
            [ -n "$name" ] ||
              { printf 'no %s package for %s\n' "$garden_family" "$capability" >&2; exit 1; }
            packages="$packages $name"
          done
          printf 'installing:%s\n' "$packages"
          garden_pm_refresh "$garden_pm"
          # shellcheck disable=SC2086
          garden_pm_install "$garden_pm" $packages
          command -v pdftotext >/dev/null
          command -v tesseract >/dev/null
          command -v rg >/dev/null

  native-shell:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:rust
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: pnpm native:configure
      - run: pnpm --filter @garden/desktop native:build --bundles app

  ios:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:configure
      - name: Build and audit the unsigned iOS simulator client
        env:
          CI: true
          CARGO_TARGET_DIR: ${{ runner.temp }}/garden-target
        run: pnpm --filter @garden/desktop ios:build --target aarch64-sim --no-sign --ci

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/desktop/src-tauri/gen/android/**/*.gradle*
            apps/desktop/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android
      - name: Install pinned Android SDK components
        run: |
          set -eu
          sdkmanager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Export the pinned NDK path
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:configure
      - name: Build and audit an unsigned CI APK
        env:
          CI: true
          CARGO_TARGET_DIR: ${{ runner.temp }}/garden-target
          GRADLE_USER_HOME: ${{ runner.temp }}/garden-gradle
        run: pnpm --filter @garden/desktop android:build --apk --target aarch64 --ci

  supply-chain:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Scan source, lockfiles, secrets, and system configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  # The behavioural suite: 49 fixtures driving the real agent loop against a scripted model and a
  # stub runner, checked against evals/baseline.json. It needs no provider key, no network and no
  # runner, which is why nothing but habit kept it out of CI. Non-zero on a failed expectation, so
  # a drift in step counts, tool choices or cost is a red run the morning after it lands rather
  # than a surprise the next time somebody runs it by hand.
  evaluation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the behavioural evaluation suite against the committed baseline
        run: pnpm eval
      # The other three rigs, all deterministic, all needing no key, no network and no runner, and
      # all previously running on no gate whatever - which is how an owner comes to be shown a
      # number by an instrument nothing protects.
      #
      # `--ci` on each is the arm that compares the run against its own committed baseline and
      # exits non-zero on a move. That is the whole point of adding them: each of these rigs prints
      # a readable table on a good day, and a table nobody diffs is a table that can drift for a
      # wave. A number that moved is a decision, and a decision has to be accepted in a commit.
      - name: Check the injection floor against its committed baseline
        run: pnpm eval:injection -- --ci
      - name: Check context quality against its committed baseline
        run: pnpm eval:context -- --ci
      - name: Check what each residency arm puts on the wire, against its committed baseline
        run: pnpm eval:arms -- --ci

  # The half of the same three rigs that cannot run without a provider credential: the blinded
  # judge on context quality, and the live model on the injection suite.
  #
  # ── Why this fails rather than skips ───────────────────────────────────────────────────────────
  #
  # Both rigs already carry the arm for it. `judge.ts:63` and `judged.ts:64` return `fatal` when the
  # judged or live half was asked for, the key is absent, and `GITHUB_ACTIONS` is set - the same
  # shape `scripts/check-repository.mjs:116` uses for shellcheck, which is optional on a laptop and
  # required on a runner. Nothing was invoking it.
  #
  # A job of its own so the credential and the measurement do not share a verdict: a missing secret
  # must never be able to hide a real regression in the deterministic gates above, and the
  # deterministic gates must never make a missing secret look survivable. The argument against
  # failing at all - that a permanently red nightly is a nightly somebody mutes - is the reason this
  # is separated rather than the reason it is silent. A graded number the owner is shown, produced
  # by a half nobody has run in months, is worse than a red square that says which half it was.
  #
  # This repository holds no provider credential by design. Set OPENROUTER_API_KEY as a repository
  # secret to arm this job; until it is set, this square is the statement that the graded halves of
  # the availability and injection numbers are not being measured.
  evaluation-judged:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Grade the window with the blinded judge, and drive the injection suite live
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GARDEN_EVAL_SPEND: ${{ vars.GARDEN_EVAL_SPEND }}
        run: |
          set -eu
          # No `if [ -z "$OPENROUTER_API_KEY" ]` here on purpose. Both rigs already decide this,
          # in the same shape and in one place each, and a second copy of the rule in YAML is the
          # copy that goes stale. With the secret unset the variable arrives empty, `--judge` and
          # `--live` were still asked for, GITHUB_ACTIONS is set, and both rigs exit non-zero
          # saying which half went unmeasured.
          #
          # `--yes` is what actually spends, and it is not on by default because it is not this
          # workflow's money: the graded half of the context rig is 390 answer calls carrying
          # about 14.7 million prompt tokens plus a grading call per probe, every night, and the
          # live injection half is about 15 more. Without it both rigs print that estimate and
          # stop, so the nightly still proves the credential works and still says what a graded
          # run would cost. Set the repository variable GARDEN_EVAL_SPEND to `yes` to buy the
          # numbers.
          spend=""
          if [ "${GARDEN_EVAL_SPEND:-}" = "yes" ]; then
            spend="--yes"
          fi
          # shellcheck disable=SC2086
          pnpm eval:context -- --ci --judge $spend
          # shellcheck disable=SC2086
          pnpm eval:injection -- --ci --live $spend
