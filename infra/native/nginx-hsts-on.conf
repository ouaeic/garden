# HSTS, written here only once a publicly trusted certificate is serving this box.
#
# Two years, with subdomains, and no `preload`: preloading is a one-way door that lives in browser
# binaries and cannot be undone on the owner's timetable, which is not a decision an installer gets
# to make for somebody's own machine.
#
# `garden certificate disable` puts the empty version back, because a box that has returned to a
# self-signed certificate with this header still cached would refuse to load at all.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
