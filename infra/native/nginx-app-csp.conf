# The application's content security policy, in one file rather than three.
#
# It was written out at the site root, in the immutable asset location and in the SPA fallback, and
# a policy that has to be edited in three places to stay one policy is a policy that will not.
#
# `connect-src` was `'self' ws: wss:`, and those two are scheme-wide wildcards with no host: they
# permitted `new WebSocket('wss://anywhere.example')` from any page on this origin. `script-src
# 'self'` means nothing was going to reach them, but it was the one directive in the policy that
# was not origin-locked, and it is the one that would carry data out.
#
# Read apps/web/index.html before widening it back. The meta policy there deliberately omits
# connect-src, on the grounds that "the workspace runner's stream and terminal are legitimately on
# another origin" - and for that file, which is also the development page and is also what the
# packaged shell loads, that is true: the runner is 127.0.0.1:4300 while the page is served from
# somewhere else entirely. This file is not that file. It is installed by nginx and applies only to
# a browser that reached the box through nginx, where the runner is `wss://$host/runner` on this
# same server block, from the same hostname, because the installer derives one from the other.
# Under CSP3 a `wss://` URL to the origin of an `https` page is already covered by `'self'`.
#
# Two arrangements sit outside that and neither is a working one being taken away. A box behind a
# relay is reached at `<label>.<relay domain>`, and a relay exists only "for a server no inbound
# connection can reach" - so the direct hostname the runner URL is built from is, by construction,
# not reachable from there, and that stream was already dead before this line changed. A browser
# opened at some other name for the same box - a LAN address while the hostname is a DDNS one - is
# already the degraded case the client itself refuses secure text input in, because api.ts compares
# the runner origin against the page's. The way to close both properly is to hand the client a
# runner URL derived from the request's own origin rather than the fixed PUBLIC_RUNNER_URL, which
# is what `runnerUrlForClient` already does for the packaged shell's local gateway; then this
# directive is exactly right in every arrangement rather than in the intended one.
add_header Content-Security-Policy "default-src 'self'; frame-src 'self' $garden_preview_origin; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
