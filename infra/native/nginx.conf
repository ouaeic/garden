limit_req_zone $binary_remote_addr zone=garden_preview:10m rate=30r/s;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;
  access_log off;

  location /.well-known/acme-challenge/ {
    root /var/lib/garden/acme;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  # The HTTP/2 syntax changed in nginx 1.25.1 and the installer selects the form
  # the packaged nginx actually understands. Ubuntu 22.04/24.04 still ship 1.18/1.24.
  include /etc/nginx/snippets/garden-https-listen.conf;
  server_name _;
  server_tokens off;
  access_log off;
  client_max_body_size 2g;
  root /opt/garden/apps/web/dist;
  include /etc/nginx/snippets/garden-preview-origin.conf;
  include /etc/nginx/mime.types;

  ssl_certificate /etc/garden/tls/server.crt;
  ssl_certificate_key /etc/garden/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:GARDEN:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Ubuntu's stock nginx.conf sets `gzip on` and leaves gzip_types and gzip_proxied commented out,
  # which compresses text/html and nothing else - and `gzip_proxied off` excludes every proxied
  # response, so the whole /v1 surface crossed the wire raw. The app's own first paint is 493 kB
  # uncompressed against 137 kB compressed, which on a phone reaching a home server is the
  # difference between opening and waiting. `gzip_proxied any` is the directive that matters for
  # /v1; the min_length keeps tiny JSON replies off the compressor.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/javascript application/javascript application/json
             application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/garden-security-headers.conf;

  # `^~` because nginx tries every regex location after the longest matching prefix unless that
  # prefix says not to, and the share viewer's script and stylesheet are API routes under
  # /v1/shares/assets/ whose names end in .js and .css: without it the stable-asset block below
  # claims them and answers from the web build on disk, where they are not.
  location ^~ /v1/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /healthz {
    proxy_pass http://127.0.0.1:4100/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Public, non-secret connection metadata. Native clients pin the advertised
  # server identity before accepting an address learned here or over mDNS.
  # nginx replaces, rather than merges, inherited add_header sets, so every location
  # that adds a header of its own must repeat the server-level security headers.
  location = /.well-known/garden {
    alias /var/lib/garden/connection.json;
    default_type application/json;
    include /etc/nginx/snippets/garden-security-headers.conf;
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*" always;
  }

  # An allow-list, not a passthrough. Published here are only the routes a phone or a browser has
  # to reach directly: the three live streams, and the browser and desktop control routes that
  # secure input depends on - typing a password must not travel through the services the agent
  # can observe. Everything else the runner serves - running commands, reading and writing files,
  # snapshots, workspace management, previews - stays on loopback for the control services alone.
  # A path that does not match falls through to the application below and never reaches 4300.
  location ~ "^/runner/(v1/workspaces/[0-9a-fA-F-]{36}/(?:terminal|browser/(?:stream|action|holder)|desktop/(?:stream|action|holder)))$" {
    proxy_pass http://127.0.0.1:4300/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_read_timeout 1h;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Old links retain their exact path and grant query while leaving the authenticated origin.
  location ~ "^/__garden/preview/[0-9a-f]{32}(?:/|$)" {
    return 308 $garden_preview_origin$request_uri;
  }

  # The build stamps a content hash into every name under /assets/, so the file at a given URL can
  # never change and a week's expiry only bought the owner a re-download of an identical bundle.
  # `^~` because a regex location would otherwise win and put the shorter expiry back.
  location ^~ /assets/ {
    expires 1y;
    include /etc/nginx/snippets/garden-security-headers.conf;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/garden-app-csp.conf;
    try_files $uri =404;
  }

  # Everything else with an asset extension: the icons, the manifest, and sw.js, whose names are
  # stable, so a year would pin a stale service worker.
  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 7d;
    include /etc/nginx/snippets/garden-security-headers.conf;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/garden-app-csp.conf;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/garden-security-headers.conf;
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/garden-app-csp.conf;
    try_files $uri $uri/ /index.html;
  }
}

# An independent browser origin for workspace applications. No control API, runner endpoint,
# static garden files or SPA fallback is reachable through this listener.
server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  server_name _;
  server_tokens off;
  access_log off;
  client_max_body_size 2g;
  ssl_certificate /etc/garden/tls/server.crt;
  ssl_certificate_key /etc/garden/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:GARDEN:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  include /etc/nginx/snippets/garden-security-headers.conf;

  location ~ "^/__garden/preview/[0-9a-f]{32}(?:/|$)" {
    limit_req zone=garden_preview burst=120 nodelay;
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    return 404;
  }
}
