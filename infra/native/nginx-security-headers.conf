# The headers every garden response carries, in one file.
#
# nginx replaces rather than merges an inherited `add_header` set: a location that declares one
# header of its own silently drops every header it would have inherited. So these were repeated in
# six places, and the only thing keeping them identical was that nobody had edited one of them yet.
# Including one file in those six places is the same behaviour with one copy to change.
#
# Strict-Transport-Security is deliberately not here. It belongs only on a box whose certificate a
# browser already trusts, and garden's default certificate is self-signed - HSTS on that combination
# does not warn the owner, it locks them out of their own computer with no way to click through.
# `garden certificate enable` writes it into the snippet below once a real one is installed.
#
# The microphone is `(self)` rather than `()` because this application records voice notes: the
# composer's record button calls `getUserMedia({ audio: true })` and posts the result to be
# transcribed. An empty allow-list is not "ask the owner", it is a refusal the owner cannot
# override - `getUserMedia` rejects before any permission prompt appears - so the header shipped
# with a feature of the product turned off in every browser that reached it through nginx. The
# camera and geolocation stay empty because nothing here has ever asked for either, and a feature
# that is never used is one an injected script must not be able to reach for.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
include /etc/nginx/snippets/garden-hsts.conf;
