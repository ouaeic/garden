# No HSTS, which is the right answer while the certificate is garden's own self-signed one.
#
# A browser that has been told to enforce HSTS for this host refuses an untrusted certificate
# outright - there is no "proceed anyway" - so sending it alongside a self-signed certificate would
# lock the owner out of their own computer rather than warn them about it.
#
# `garden certificate enable` replaces this file the moment a publicly trusted certificate is
# installed, and `garden certificate disable` puts it back. Empty on purpose: nginx includes it
# either way, so the switch is the contents of one file rather than an edit to the site.
